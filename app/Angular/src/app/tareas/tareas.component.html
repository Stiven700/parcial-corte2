<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Lista de Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let tarea of tareas; let i = index">
      {{ tarea }}
      <ion-button color="danger" slot="end" (click)="eliminarTarea(i)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-input [(ngModel)]="nuevaTarea" placeholder="Nueva tarea"></ion-input>
    <ion-button slot="end" (click)="agregarTarea()">Agregar</ion-button>
  </ion-item>
</ion-content>
